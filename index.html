<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>All In One - Tư Ngữ Audio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10'/%3E%3C/svg%3E">
    <!-- CodeMirror: engine editor ảo hóa - chỉ render phần văn bản đang hiển thị trên màn hình
         thay vì toàn bộ nội dung, giải quyết tận gốc hiện tượng đứng máy khi gõ vào văn bản lớn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <style>
:root {
	/* --- COLOR PALETTE 2025 --- */
	--bg-app: #09090b;
	--bg-panel: #121215;
	--bg-surface: #18181b;
	--bg-input: #202024;

	--border-base: rgba(255, 255, 255, 0.08);
	--border-highlight: rgba(255, 255, 255, 0.15);

	--primary: #3b82f6;
	--primary-hover: #2563eb;
	--primary-glow: rgba(59, 130, 246, 0.4);

	--success: #10b981;
	--danger: #ef4444;
	--warning: #f59e0b;
	--text-main: #ececec;
	--text-muted: #a1a1aa;
	--text-dim: #52525b;

	/* --- DIMENSIONS & SPACING --- */
	--radius-lg: 12px;
	--radius-md: 8px;
	--radius-sm: 6px;

	--font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
	--font-mono: 'JetBrains Mono', 'Fira Code', monospace;

	--ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

/* --- RESET & BASE --- */
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
	outline: none;
}

body {
	background-color: var(--bg-app);
	background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 40%);
	color: var(--text-main);
	font-family: var(--font-sans);
	height: 100vh;
	width: 100vw;
	overflow: hidden;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 0;
	-webkit-font-smoothing: antialiased;
}

/* --- LAYOUT CONTAINER --- */
.app-container {
	width: 100%;
	height: 100%;
	background: var(--bg-app);
	display: grid;
	grid-template-columns: 360px 1fr;
	grid-template-rows: 56px 1fr;
	overflow: hidden;
	border: none;
}

/* --- HEADER --- */
.app-header {
	grid-column: 1 / -1;
	border-bottom: 1px solid var(--border-base);
	background: var(--bg-panel);
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0 20px;
	z-index: 10;
}

.brand {
	font-weight: 700;
	font-size: 1rem;
	color: var(--text-main);
	display: flex;
	align-items: center;
	gap: 10px;
	letter-spacing: -0.01em;
}

.brand svg {
	color: var(--primary);
}

.brand span {
	font-size: 0.7rem;
	background: rgba(59, 130, 246, 0.1);
	color: var(--primary);
	padding: 3px 8px;
	border-radius: var(--radius-sm);
	font-weight: 600;
	border: 1px solid rgba(59, 130, 246, 0.2);
}

.header-right {
	display: flex;
	align-items: center;
	gap: 14px;
}

.header-version {
	font-size: 0.8rem;
	color: var(--text-muted);
}

/* Nút mở/đóng drawer menu - chỉ hiển thị trên mobile (xem media query) */
.btn-menu-toggle {
	display: none;
	align-items: center;
	justify-content: center;
	width: 38px;
	height: 38px;
	background: var(--bg-surface);
	border: 1px solid var(--border-base);
	border-radius: var(--radius-md);
	color: var(--text-main);
	cursor: pointer;
	flex-shrink: 0;
}
.btn-menu-toggle:hover { border-color: var(--primary); color: var(--primary); }

/* Lớp phủ tối phía sau drawer khi mở trên mobile */
.sidebar-backdrop {
	display: none;
	position: fixed;
	inset: 0;
	background: rgba(0, 0, 0, 0.6);
	z-index: 999;
	opacity: 0;
	pointer-events: none;
	transition: opacity 0.3s var(--ease-out);
}
.sidebar-backdrop.show { opacity: 1; pointer-events: auto; }

/* Header riêng bên trong drawer (mobile), có nút đóng - ẩn trên desktop */
.sidebar-drawer-header {
	display: none;
	align-items: center;
	justify-content: space-between;
	padding: 14px 16px;
	border-bottom: 1px solid var(--border-base);
	font-weight: 700;
	font-size: 0.85rem;
	color: var(--text-main);
	flex-shrink: 0;
}
.btn-sidebar-close {
	background: transparent;
	border: none;
	color: var(--text-muted);
	cursor: pointer;
	width: 32px;
	height: 32px;
	display: flex;
	align-items: center;
	justify-content: center;
	border-radius: var(--radius-sm);
}
.btn-sidebar-close:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

/* Thanh nổi điều hướng kết quả tìm kiếm (hiện khi có kết quả + drawer đã đóng) */
.floating-search-bar {
	display: none;
	align-items: center;
	gap: 8px;
	background: var(--bg-panel);
	border: 1px solid rgba(59, 130, 246, 0.3);
	border-radius: var(--radius-md);
	padding: 8px 10px;
	box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
	flex-wrap: wrap;
}
.floating-search-bar.show { display: flex; }
.btn-float-nav {
	width: 32px;
	height: 32px;
	flex-shrink: 0;
	border-radius: var(--radius-sm);
	background: var(--bg-surface);
	border: 1px solid var(--border-base);
	color: var(--text-main);
	display: flex;
	align-items: center;
	justify-content: center;
	cursor: pointer;
}
.btn-float-nav:hover { border-color: var(--primary); color: var(--primary); }
.floating-search-counter {
	font-family: var(--font-mono);
	font-size: 0.75rem;
	color: var(--text-muted);
	min-width: 52px;
	text-align: center;
	flex-shrink: 0;
}
.btn-float-replace {
	flex: 1;
	min-width: 96px;
	padding: 7px 10px;
	font-size: 0.75rem;
	font-weight: 600;
	border-radius: var(--radius-sm);
	border: 1px solid var(--border-base);
	background: var(--bg-surface);
	color: var(--text-main);
	cursor: pointer;
	white-space: nowrap;
	transition: all 0.2s;
}
.btn-float-replace:hover { border-color: var(--text-muted); }
.btn-float-replace.primary { background: var(--success); border-color: var(--success); color: #fff; }
.btn-float-replace.primary:hover { background: #059669; }
.btn-float-close {
	width: 28px;
	height: 28px;
	border-radius: 50%;
	background: transparent;
	border: none;
	color: var(--text-muted);
	cursor: pointer;
	flex-shrink: 0;
	margin-left: auto;
	display: flex;
	align-items: center;
	justify-content: center;
}
.btn-float-close:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

/* --- SIDEBAR --- */
.sidebar {
	background: var(--bg-panel);
	border-right: 1px solid var(--border-base);
	display: flex;
	flex-direction: column;
	overflow: hidden;
	height: 100%;
}

/* --- TABS SYSTEM --- */
.sidebar-tabs {
	display: flex;
	padding: 0 4px;
	border-bottom: 1px solid var(--border-base);
	background: var(--bg-panel);
}

.tab-btn {
	flex: 1;
	padding: 14px 0;
	background: transparent;
	border: none;
	color: var(--text-muted);
	font-size: 0.85rem;
	font-weight: 500;
	cursor: pointer;
	position: relative;
	transition: color 0.2s;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
}

.tab-btn:hover {
	color: var(--text-main);
}

.tab-btn.active {
	color: var(--primary);
}

.tab-btn.active::after {
	content: '';
	position: absolute;
	bottom: -1px;
	left: 0;
	right: 0;
	height: 2px;
	background: var(--primary);
	box-shadow: 0 -2px 10px var(--primary-glow);
}

.tab-content {
	display: none;
	padding: 20px;
	flex-direction: column;
	gap: 16px;
	overflow-y: auto;
	flex: 1;
}

.tab-content.active {
	display: flex;
	animation: fadeIn 0.3s var(--ease-out);
}

@keyframes fadeIn {
	from {
		opacity: 0;
		transform: translateY(5px);
	}

	to {
		opacity: 1;
		transform: translateY(0);
	}
}

/* --- INPUTS & FORMS --- */
.section-title {
	font-size: 0.7rem;
	text-transform: uppercase;
	letter-spacing: 0.08em;
	color: var(--text-muted);
	font-weight: 700;
	margin-bottom: 8px;
	display: flex;
	align-items: center;
	gap: 6px;
}

.input-group {
	display: flex;
	flex-direction: column;
	gap: 8px;
}

textarea,
input[type="text"] {
	background: var(--bg-input);
	border: 1px solid var(--border-base);
	color: var(--text-main);
	border-radius: var(--radius-md);
	padding: 10px 12px;
	font-family: var(--font-mono);
	font-size: 0.8rem;
	transition: all 0.2s;
	width: 100%;
}

textarea:focus,
input[type="text"]:focus {
	border-color: var(--primary);
	box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
	background: var(--bg-surface);
}

textarea {
	line-height: 1.6;
}

/* Radio Grid */
.radio-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 8px;
}

.radio-item input[type="radio"] {
	display: none;
}

.radio-item label {
	display: flex;
	align-items: center;
	justify-content: center;
	background: var(--bg-surface);
	border: 1px solid var(--border-base);
	padding: 10px;
	border-radius: var(--radius-md);
	font-size: 0.75rem;
	cursor: pointer;
	transition: all 0.2s;
	color: var(--text-muted);
	font-weight: 500;
}

.radio-item label:hover {
	border-color: var(--border-highlight);
	color: var(--text-main);
}

.radio-item input:checked+label {
	background: rgba(59, 130, 246, 0.1);
	border-color: var(--primary);
	color: var(--primary);
	font-weight: 600;
	box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.2);
}

/* --- BUTTONS --- */
.btn-primary {
	width: 100%;
	background: var(--primary);
	color: white;
	border: 1px solid rgba(255, 255, 255, 0.1);
	padding: 10px;
	border-radius: var(--radius-md);
	font-weight: 600;
	font-size: 0.85rem;
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
	transition: all 0.2s;
	box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
}

.btn-primary:hover {
	background: var(--primary-hover);
	transform: translateY(-1px);
}

.btn-primary:active {
	transform: translateY(0);
}

.btn-primary:disabled {
	background: var(--bg-surface);
	color: var(--text-muted);
	border-color: var(--border-base);
	cursor: not-allowed;
	box-shadow: none;
}

.btn-secondary {
	width: 100%;
	background: var(--bg-surface);
	border: 1px solid var(--border-base);
	color: var(--text-main);
	padding: 10px;
	border-radius: var(--radius-md);
	font-size: 0.8rem;
	font-weight: 500;
	cursor: pointer;
	transition: all 0.2s;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 6px;
}

.btn-secondary:hover {
	background: rgba(255, 255, 255, 0.03);
	border-color: var(--text-muted);
}

/* --- LOG AREA --- */
.log-container {
	display: flex;
	flex-direction: column;
	height: 300px;
	flex-shrink: 0;
	border-top: 1px solid var(--border-base);
	background: #0f0f11;
}

.log-header {
	padding: 6px 12px;
	border-bottom: 1px solid var(--border-base);
	font-size: 0.65rem;
	text-transform: uppercase;
	color: var(--text-muted);
	font-weight: 700;
	letter-spacing: 0.05em;
	display: flex;
	justify-content: space-between;
	align-items: center;
	background: rgba(255, 255, 255, 0.01);
}

.log-content {
	padding: 10px;
	overflow-y: auto;
	font-family: var(--font-mono);
	font-size: 0.7rem;
	display: flex;
	flex-direction: column;
	gap: 2px;
}

.log-line {
	padding: 2px 0;
	border-bottom: 1px solid rgba(255, 255, 255, 0.03);
	word-break: break-all;
	white-space: pre-wrap;
}

.text-info { color: #60a5fa; }
.text-success { color: #34d399; }
.text-error { color: #f87171; }
.text-warn { color: #fbbf24; }

/* --- MAIN EDITOR AREA --- */
.main-area {
	display: flex;
	flex-direction: column;
	padding: 20px;
	gap: 16px;
	height: 100%;
	overflow: hidden;
	background: var(--bg-app);
}

.toolbar {
	display: flex;
	gap: 8px;
	flex-wrap: wrap;
	padding-bottom: 4px;
}

.btn-tool {
	background: transparent;
	border: 1px solid transparent;
	border-color: var(--border-base);
	color: var(--text-muted);
	padding: 6px 12px;
	border-radius: var(--radius-md);
	font-size: 0.75rem;
	font-weight: 500;
	cursor: pointer;
	transition: all 0.2s;
	display: flex;
	align-items: center;
	gap: 6px;
}

.btn-tool:hover {
	background: var(--bg-surface);
	color: var(--text-main);
	border-color: var(--border-base);
}

.btn-tool.danger { color: var(--danger); }
.btn-tool.danger:hover {
	background: rgba(239, 68, 68, 0.1);
	border-color: rgba(239, 68, 68, 0.2);
}

/* DRAG AND DROP STYLING */
.editor-wrapper {
	flex: 1;
	border: 1px solid var(--border-base);
	border-radius: var(--radius-lg);
	background: var(--bg-surface);
	overflow: hidden;
	display: flex;
	flex-direction: column;
	box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
	position: relative;
    transition: all 0.3s var(--ease-out);
}

.editor-wrapper.drag-over {
    border-color: var(--primary);
    background: rgba(59, 130, 246, 0.05);
    box-shadow: 0 0 0 2px var(--primary-glow);
}

.editor-header {
	padding: 8px 16px;
	background: rgba(0, 0, 0, 0.2);
	border-bottom: 1px solid var(--border-base);
	display: flex;
	flex-wrap: wrap;
	justify-content: space-between;
	align-items: center;
	gap: 6px 12px;
	font-size: 0.7rem;
	color: var(--text-muted);
	font-family: var(--font-mono);
}

.editor-header-left {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 8px;
	min-width: 0;
}

.editor-label { white-space: nowrap; }
.editor-label-hint { color: var(--text-dim); }

/* Nút "Tải file lên": phương án thay thế cho kéo-thả, vì trên điện thoại
   (mặc định của nền tảng, không riêng gì web này) thao tác kéo-thả file
   từ trình quản lý tệp vào trình duyệt rất bất tiện. */
.btn-upload {
	display: flex;
	align-items: center;
	gap: 5px;
	background: rgba(59, 130, 246, 0.1);
	border: 1px solid rgba(59, 130, 246, 0.25);
	color: var(--primary);
	padding: 5px 10px;
	border-radius: var(--radius-sm);
	font-family: var(--font-sans);
	font-size: 0.7rem;
	font-weight: 600;
	cursor: pointer;
	transition: all 0.2s;
	white-space: nowrap;
	flex-shrink: 0;
}

.btn-upload:hover {
	background: var(--primary);
	color: white;
}

.btn-upload:active { transform: translateY(1px); }

/* #editor (textarea gốc) giờ bị CodeMirror ẩn đi (display:none tự động).
   Toàn bộ style hiển thị chuyển sang .CodeMirror bên dưới. */
.CodeMirror {
	flex: 1;
	width: 100%;
	height: 100% !important;
	border: none;
	background: transparent !important;
	font-family: var(--font-mono);
	font-size: 0.9rem;
	line-height: 1.6;
	color: var(--text-main);
	/* Font đơn cách + tắt ligature/kerning: engine layout của trình duyệt
	   (đặc biệt trên Linux) tính lại nhanh hơn nhiều mỗi khi gõ. */
	font-variant-ligatures: none;
	font-kerning: none;
}

.CodeMirror-lines { padding: 20px 0; }
.CodeMirror pre.CodeMirror-line,
.CodeMirror pre.CodeMirror-line-like { padding: 0 20px; }

.CodeMirror-cursor { border-left: 1px solid var(--text-main) !important; }
.CodeMirror-selected { background: rgba(59, 130, 246, 0.3) !important; }
.CodeMirror-focused .CodeMirror-selected { background: rgba(59, 130, 246, 0.35) !important; }
.CodeMirror-gutters { display: none !important; }
.CodeMirror-scrollbar-filler { background: transparent !important; }

::selection {
	background: rgba(59, 130, 246, 0.3);
	color: #fff;
}

/* --- FOOTER ACTIONS --- */
.action-footer {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 12px;
	margin-top: auto;
}

.btn-action {
	padding: 12px;
	border-radius: var(--radius-md);
	border: 1px solid var(--border-base);
	background: var(--bg-surface);
	color: var(--text-muted);
	font-weight: 600;
	font-size: 0.85rem;
	cursor: pointer;
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 8px;
	transition: all 0.2s;
}

.btn-action:hover {
	background: rgba(255, 255, 255, 0.05);
	color: var(--text-main);
}

.btn-action.primary {
	background: rgba(16, 185, 129, 0.1);
	color: var(--success);
	border-color: rgba(16, 185, 129, 0.2);
}

.btn-action.primary:hover {
	background: var(--success);
	color: white;
	box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
}

/* --- UTILS & TOAST --- */
.spinner {
	width: 14px;
	height: 14px;
	border: 2px solid rgba(255, 255, 255, 0.3);
	border-top-color: #fff;
	border-radius: 50%;
	animation: spin 0.8s linear infinite;
	display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

.progress-wrapper {
	height: 3px;
	background: rgba(255, 255, 255, 0.05);
	border-radius: 2px;
	margin-top: 12px;
	overflow: hidden;
	display: none;
}
.progress-fill {
	height: 100%;
	background: var(--success);
	width: 0%;
	transition: width 0.3s ease;
	box-shadow: 0 0 10px var(--success);
}

.toast {
	position: fixed;
	bottom: 30px;
	right: 30px;
	background: var(--bg-surface);
	border: 1px solid var(--border-highlight);
	padding: 12px 20px;
	border-radius: var(--radius-md);
	display: flex;
	align-items: center;
	gap: 12px;
	box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
	transform: translateY(20px);
	opacity: 0;
	pointer-events: none;
	transition: all 0.4s var(--ease-out);
	z-index: 9999;
}

.toast.show {
	transform: translateY(0);
	opacity: 1;
	pointer-events: auto;
}
.toast span:first-child { font-size: 1.1rem; }
.toast span:last-child { font-size: 0.85rem; font-weight: 500; }

/* --- MODAL UI (BỘ LỌC CÁ NHÂN) --- */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.2s;
}

.modal-overlay.show {
    display: flex;
    opacity: 1;
}

.modal-content {
    background: var(--bg-panel);
    border: 1px solid var(--border-base);
    border-radius: var(--radius-lg);
    width: 90%;
    max-width: 650px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    transform: translateY(10px);
    transition: transform 0.2s var(--ease-out);
}

.modal-overlay.show .modal-content {
    transform: translateY(0);
}

.modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-base);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
}

.btn-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
}

.btn-close:hover { color: var(--danger); }

.preset-add-form {
    padding: 16px 20px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-base);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
}

.preset-add-form input[type="text"] { flex: 1; min-width: 150px; }

.preset-regex-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
}

.preset-list {
    padding: 16px 20px;
    max-height: 40vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.preset-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-input);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-base);
}

.preset-item-info {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    word-break: break-word;
    flex: 1;
    margin-right: 15px;
}

.tag-regex {
    display: inline-block;
    font-size: 0.65rem;
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 8px;
    font-weight: 600;
    letter-spacing: 0.05em;
}

.btn-del {
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
}

.btn-del:hover {
    background: var(--danger);
    color: white;
}

.modal-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border-base);
}


/* --- SCROLLBARS --- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

/* --- NAV CONTROLS (SEARCH) --- */
.nav-controls {
	display: none;
	grid-template-columns: 36px 1fr 36px;
	gap: 6px;
	margin-bottom: 5px;
}
.nav-controls.active { display: grid; }

.btn-nav {
	background: var(--bg-surface);
	border: 1px solid var(--border-base);
	color: var(--text-main);
	border-radius: var(--radius-md);
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
	height: 32px;
}
.btn-nav:hover { border-color: var(--primary); color: var(--primary); }

.nav-counter {
	background: transparent;
	border: 1px solid var(--border-base);
	border-radius: var(--radius-md);
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 0.75rem;
	color: var(--text-muted);
	font-family: var(--font-mono);
}

.checkbox-row {
	display: flex;
	align-items: center;
	gap: 10px;
	margin-top: 8px;
}
.checkbox-row label { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; }
.checkbox-row input { width: auto; margin-right: 4px; }

/* --- RESPONSIVE --- */
/* Từ đây trở xuống: sidebar (Lấy dữ liệu / Tìm kiếm & Thay thế) chuyển thành
   1 drawer trượt ra từ bên trái, mở/đóng bằng nút hamburger trên header.
   Nhờ vậy Text Editor (phần quan trọng nhất khi dùng trên điện thoại) được
   chiếm trọn phần còn lại của màn hình, thay vì bị sidebar cố định chiếm chỗ. */
@media (max-width: 900px) {
	.app-container {
		grid-template-columns: 1fr;
		grid-template-rows: 56px 1fr;
	}

	.header-version { display: none; } /* nhường chỗ cho nút menu trên header hẹp */
	.btn-menu-toggle { display: flex; }
	.sidebar-backdrop { display: block; }
	.sidebar-drawer-header { display: flex; }

	.sidebar {
		position: fixed;
		top: 0;
		left: 0;
		width: min(88vw, 380px);
		max-width: 380px;
		height: 100vh;
		height: 100dvh;
		max-height: none;
		z-index: 1000;
		border-right: 1px solid var(--border-base);
		box-shadow: 12px 0 45px rgba(0, 0, 0, 0.5);
		transform: translateX(-100%);
		transition: transform 0.3s var(--ease-out);
	}
	.sidebar.open { transform: translateX(0); }

	.main-area { padding: 15px; }
	.log-container { height: 200px; }
}

/* --- MOBILE PORTRAIT (tối ưu cho màn dọc rộng tối thiểu ~449dp, kiểu Galaxy A34 5G) --- */
@media (max-width: 600px) {
	/* vh làm fallback cho trình duyệt cũ, dvh (chiều cao viewport ĐỘNG) ghi đè sau cùng
	   để tự co giãn theo thanh địa chỉ / thanh tìm kiếm ẩn-hiện trên di động */
	html, body { height: 100vh; }
	html, body { height: 100dvh; }

	/* Hỗ trợ vùng an toàn (tai thỏ / viền bo) trên các máy Android hiện đại */
	.app-container {
		padding-bottom: env(safe-area-inset-bottom, 0);
	}

	.app-header { padding: 0 12px; }
	.brand { font-size: 0.85rem; gap: 6px; }
	.brand svg { width: 20px; height: 20px; flex-shrink: 0; }
	.brand span { font-size: 0.6rem; padding: 2px 6px; }

	.sidebar-tabs { padding: 0 2px; }
	.tab-btn { padding: 12px 0; font-size: 0.78rem; gap: 5px; }
	.tab-btn svg { width: 13px; height: 13px; }

	.tab-content { padding: 14px; gap: 12px; }

	textarea, input[type="text"] { font-size: 0.85rem; padding: 10px; }
	.radio-grid { gap: 6px; }
	.radio-item label { padding: 9px 6px; font-size: 0.72rem; }

	/* Đảm bảo vùng chạm tối thiểu ~44px cho các nút chính, dễ bấm bằng ngón tay */
	.btn-primary, .btn-secondary { min-height: 44px; font-size: 0.8rem; }
	.btn-nav { min-width: 40px; }

	.log-content { font-size: 0.68rem; }

	.main-area { padding: 10px; gap: 10px; }

	/* Thanh công cụ: cuộn ngang thay vì xuống dòng liên tục, để dành chiều cao cho khung soạn thảo */
	.toolbar {
		flex-wrap: nowrap;
		overflow-x: auto;
		-webkit-overflow-scrolling: touch;
		scrollbar-width: thin;
		padding-bottom: 6px;
		margin: 0 -10px;
		padding-left: 10px;
		padding-right: 10px;
		width: calc(100% + 20px);
	}
	.btn-tool {
		flex-shrink: 0;
		min-height: 38px;
		font-size: 0.72rem;
		padding: 7px 10px;
	}
	.btn-tool.danger { margin-left: 4px !important; }

	/* Thanh nổi điều hướng kết quả tìm kiếm: gọn lại trên màn hẹp */
	.floating-search-bar { padding: 7px 8px; gap: 6px; }
	.btn-float-replace { font-size: 0.7rem; padding: 7px 8px; min-width: 80px; }

	.editor-header {
		padding: 8px 12px;
		font-size: 0.65rem;
	}
	.editor-header-left { gap: 6px; }
	.editor-label-hint { display: none; } /* Ẩn gợi ý kéo-thả trên mobile, vì đã có nút "Tải file lên" thay thế */
	.btn-upload { padding: 6px 10px; font-size: 0.68rem; min-height: 32px; }
	#charCount { width: 100%; font-size: 0.62rem; }

	.CodeMirror { font-size: 0.85rem; }
	.CodeMirror-lines { padding: 14px 0; }
	.CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like { padding: 0 14px; }

	.action-footer { gap: 8px; }
	.btn-action { padding: 12px 6px; font-size: 0.76rem; min-height: 46px; gap: 6px; }
	.btn-action svg { width: 16px; height: 16px; flex-shrink: 0; }

	.modal-content { width: 94%; max-height: 88vh; }
	.preset-add-form { padding: 12px; gap: 8px; }
	.preset-add-form input[type="text"] { min-width: 120px; }
	.modal-header { padding: 14px 16px; }
	.preset-list { padding: 12px 16px; }
	.modal-footer { padding: 12px 16px; }

	.toast { left: 12px; right: 12px; bottom: 16px; }
}

/* Tinh chỉnh thêm cho chiều rộng rất hẹp (sát ngưỡng tối thiểu 449dp) */
@media (max-width: 460px) {
	.brand span { display: none; } /* Ẩn badge "Tư Ngữ Audio" để tránh chèn ép, tên đã đủ trong "brand" chính */
	.checkbox-row { flex-wrap: wrap; row-gap: 6px; }
	/* Vẫn giữ 2 nút chia đôi chung 1 hàng, chỉ thu nhỏ padding/chữ/khoảng cách cho vừa màn hẹp */
	.action-footer { gap: 6px; }
	.btn-action { padding: 10px 4px; font-size: 0.7rem; gap: 4px; }
	.btn-action svg { width: 14px; height: 14px; }
}
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="brand">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            All In One <span>Tư Ngữ Audio</span>
        </div>
        <div class="header-right">
            <div class="header-version">V17.07.2026</div>
            <!-- Nút menu: chỉ hiện trên mobile, thu gọn 2 tab "Lấy dữ liệu" / "Tìm kiếm & Thay thế"
                 vào 1 drawer trượt ra, để Text Editor được chiếm trọn màn hình chính -->
            <button type="button" class="btn-menu-toggle" id="btnMenuToggle" title="Menu" aria-label="Mở menu công cụ">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-drawer-header">
            <span>Công cụ</span>
            <button type="button" class="btn-sidebar-close" id="btnSidebarClose" aria-label="Đóng menu">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="sidebar-tabs">
            <button class="tab-btn active" onclick="switchTab('fetch')">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Lấy dữ liệu
            </button>
            <button class="tab-btn" onclick="switchTab('search')">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                Tìm kiếm & Thay thế
            </button>
        </div>

        <div id="tab-fetch" class="tab-content active">
            <div class="input-group">
                <div class="section-title">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Danh sách Link
                </div>
                <textarea id="links" placeholder="Mỗi dòng một link..." style="height: 100px;" spellcheck="false"></textarea>
            </div>

            <div class="input-group">
                <div class="section-title">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    Cấu hình Nguồn
                </div>
                
                <div class="radio-grid">
                    <div class="radio-item"><input type="radio" id="s_custom" name="sourceType" value="custom" onchange="toggleConfig()" checked><label for="s_custom">Custom</label></div>
                    <div class="radio-item"><input type="radio" id="s_truyenfull" name="sourceType" value="truyenfull" onchange="toggleConfig()"><label for="s_truyenfull">Truyện Full</label></div>
                    <div class="radio-item"><input type="radio" id="s_wattpad" name="sourceType" value="wattpadvn" onchange="toggleConfig()"><label for="s_wattpad">WattpadVN</label></div>
		            <div class="radio-item"><input type="radio" id="s_wattpadcom" name="sourceType" value="wattpadcom" onchange="toggleConfig()"><label for="s_wattpadcom">WattpadCOM</label></div>
                </div>

                <div id="customConfigBox" style="margin-top: 5px; display: flex; flex-direction: column; gap: 8px;">
                    <input type="text" id="customSelectors" placeholder="Selector (VD: .post-body)" style="height: 60px;" />
                </div>
                
                <input type="hidden" id="hiddenCode" placeholder="Regex xóa rác (VD: position: absolute;)" />
            </div>

            <div>
                <button class="btn-primary" id="startBtn" onclick="startFetch()">
                    <div class="spinner" id="btnSpinner"></div>
                    <span id="btnText">Bắt đầu Fetch Dữ Liệu</span>
                </button>
                <div class="progress-wrapper" id="progressContainer">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
            </div>
        </div>

        <div id="tab-search" class="tab-content">
            <div class="input-group">
                <div class="section-title" style="color: var(--primary);">Tìm kiếm</div>
                <textarea id="findStr" placeholder="Nhập văn bản cần tìm (Hỗ trợ nhiều dòng)..." style="height: 100px; border-color: var(--primary);" spellcheck="false"></textarea>
                <div class="checkbox-row">
                    <input type="checkbox" id="useRegex"> <label for="useRegex" title="Sử dụng biểu thức chính quy">Regex Mode</label>
                    <input type="checkbox" id="caseSensitive" style="margin-left: 15px;"> <label for="caseSensitive">Phân biệt hoa/thường</label>
                </div>
            </div>

            <div class="input-group">
                <div class="section-title" style="color: var(--success);">Thay thế bằng</div>
                <textarea id="replaceStr" placeholder="Nội dung thay thế (Hỗ trợ nhiều dòng)..." style="height: 80px; border-color: var(--success);" spellcheck="false"></textarea>
            </div>

            <div id="navControls" class="nav-controls">
                <button class="btn-nav" onclick="navMatch(-1)" title="Trước">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div class="nav-counter" id="navCounter">0 / 0</div>
                <button class="btn-nav" onclick="navMatch(1)" title="Sau">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <div style="display: flex; gap: 10px; flex-direction: column;">
                <button class="btn-secondary" onclick="initSearch()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right:5px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Duyệt tìm
                </button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-secondary" onclick="replaceOne()" style="border-color: var(--success); color: var(--success);">Thay thế hiện tại</button>
                    <button class="btn-primary" onclick="deferHeavy(replaceAll)" style="background: linear-gradient(135deg, var(--success), #059669);">Thay thế Hết</button>
                </div>
            </div>
        </div>

        <div class="log-container">
            <div class="log-header">
                <span>System Logs</span>
                <span id="logStatus" style="opacity: 0.6">Ready</span>
            </div>
            <div class="log-content" id="logBox">
                <span style="opacity: 0.3; font-style: italic;">Chờ lệnh xử lý...</span>
            </div>
        </div>
    </aside>

    <main class="main-area">
        <!-- Thanh điều hướng kết quả tìm kiếm nổi: xuất hiện khi có kết quả tìm kiếm
             và người dùng đã đóng drawer để quay lại Text Editor, giúp duyệt/thay thế
             mà không cần mở lại menu -->
        <div class="floating-search-bar" id="floatingSearchBar">
            <button type="button" class="btn-float-nav" onclick="navMatch(-1)" title="Kết quả trước">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div class="floating-search-counter" id="floatingNavCounter">0 / 0</div>
            <button type="button" class="btn-float-nav" onclick="navMatch(1)" title="Kết quả sau">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
            <button type="button" class="btn-float-replace" onclick="replaceOne()">Thay hiện tại</button>
            <button type="button" class="btn-float-replace primary" onclick="deferHeavy(replaceAll)">Thay hết</button>
            <button type="button" class="btn-float-close" onclick="dismissFloatingSearchBar()" title="Ẩn thanh này" aria-label="Ẩn">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="toolbar">

            <button class="btn-tool" onclick="openPresetModal()" style="color: var(--primary); border-color: rgba(59,130,246,0.3);">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                Bộ Lọc Cá Nhân
            </button>

            <button class="btn-tool" onclick="deferHeavy(processTuTYT)" title="Lọc các dòng *** n ***, C n, x/y và chèn dòng trống giữa các đoạn">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18M3 12h18M3 18h18"></path></svg>
                Lọc TYT
            </button>

            <button class="btn-tool" onclick="deferHeavy(formatWattpad)">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Lọc Wattpad + Link
            </button>

            <button class="btn-tool" onclick="deferHeavy(removeEmptyLines)">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                Xóa Dòng Trống
            </button>

            <button class="btn-tool" onclick="deferHeavy(smartJoin)">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                Nối Thông Minh
            </button>
            
            <button class="btn-tool" onclick="deferHeavy(addPunctuation)" title="Thêm dấu chấm vào cuối dòng nếu thiếu">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12m6-6H6"/></svg>
                Thêm dấu câu
            </button>

            <button class="btn-tool" onclick="deferHeavy(formatVanAn)" title="Chuyển thành chuỗi escape \n">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                Format Văn Án

<script>
/* ================= SYSTEM UTILS ================= */
const UI = {
    toast: (msg, type = 'info') => {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = 'toast';
        const icons = {
            success: '✅',
            error: '❌',
            info: 'ℹ️',
            warn: '⚠️'
        };
        el.innerHTML = `<span style="font-size:1.2rem">${icons[type]||icons.info}</span><span>${msg}</span>`;
        container.appendChild(el);
        setTimeout(() => el.classList.add('show'), 10);
        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.remove(), 400);
        }, 3000);
    },
    log: (msg, type = 'info') => {
        const box = document.getElementById('logBox');
        if (box.querySelector('span[style]')) box.innerHTML = '';
        const time = new Date().toLocaleTimeString('vi-VN', {
            hour12: false
        });
        const line = document.createElement('div');
        line.className = `log-line text-${type}`;
        line.innerText = `[${time}] ${msg}`;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    },
    processing: (state, total = 0) => {
        const btn = document.getElementById('startBtn');
        const spinner = document.getElementById('btnSpinner');
        const text = document.getElementById('btnText');
        const barWrap = document.getElementById('progressContainer');
        const bar = document.getElementById('progressBar');
        if (state) {
            btn.disabled = true;
            spinner.style.display = 'block';
            text.innerText = `Đang xử lý (0/${total})...`;
            barWrap.style.display = 'block';
            bar.style.width = '0%';
        } else {
            btn.disabled = false;
            spinner.style.display = 'none';
            text.innerText = 'Bắt đầu Fetch Dữ Liệu';
            setTimeout(() => {
                barWrap.style.display = 'none';
            }, 2000);
        }
    }
};

let _statsDebounceTimer = null;
const STATS_DEBOUNCE_MS = 400; // Chỉ tính lại từ/dòng sau khi ngừng gõ 400ms, tránh treo UI với văn bản lớn

function onEditorInput() {
    searchState.isDirty = true;

    // Cập nhật số ký tự ngay lập tức (rẻ, O(1)) để UI vẫn phản hồi tức thì
    const text = document.getElementById('editor').value;
    updateCharCountOnly(text.length);

    // Việc đếm từ/dòng (split trên toàn bộ text) rất tốn kém với văn bản lớn
    // (vài trăm nghìn - vài triệu ký tự) nếu chạy trên MỖI phím gõ.
    // Debounce lại để chỉ tính khi người dùng tạm ngừng gõ.
    clearTimeout(_statsDebounceTimer);
    _statsDebounceTimer = setTimeout(updateStats, STATS_DEBOUNCE_MS);
}

function updateCharCountOnly(charCount) {
    const el = document.getElementById('charCount');
    // Giữ nguyên phần dòng/từ/thời gian cũ (nếu có), chỉ thay số ký tự để tránh nhấp nháy sai số
    const current = el.dataset.lastFull;
    if (current) {
        el.innerHTML = current.replace(/[\d.,]+(?= ký tự)/, charCount.toLocaleString());
    } else {
        el.innerHTML = `<span style="color:var(--text-muted)">... | ${charCount.toLocaleString()} ký tự | <span style="color:var(--primary)">🎧 ~...</span></span>`;
    }
}

function updateStats() {
    const text = document.getElementById('editor').value;
    const charCount = text.length;
    
    // Đếm số từ, số dòng
    const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    // CodeMirror đã tự theo dõi số dòng nội bộ (O(1)) - dùng lại thay vì split() toàn bộ text lần nữa
    const lineCount = window.cmEditor ? window.cmEditor.lineCount() : (text === '' ? 0 : text.split(/\n/).length);

    // Tính thời gian TTS (Tốc độ 1.35x = ~255 từ / phút)
    const WPM = 255; 
    const totalRawMinutes = wordCount / WPM;
    const hours = Math.floor(totalRawMinutes / 60);
    const minutes = Math.floor(totalRawMinutes % 60);
    const seconds = Math.round((totalRawMinutes - Math.floor(totalRawMinutes)) * 60);

    let timeStr = "";
    if (hours > 0) {
        timeStr = `${hours}h ${minutes}p ${seconds}s`;
    } else {
        timeStr = `${minutes}p ${seconds}s`;
    }

    const html = `<span style="color:var(--text-muted)">${lineCount.toLocaleString()} dòng | ${wordCount.toLocaleString()} từ | ${charCount.toLocaleString()} ký tự | <span style="color:var(--primary)">🎧 ~${timeStr}</span></span>`;
    const el = document.getElementById('charCount');
    el.innerHTML = html;
    el.dataset.lastFull = html;
}

function toggleConfig() {
    const type = document.querySelector('input[name="sourceType"]:checked').value;
    document.getElementById('customConfigBox').style.display = (type === 'custom') ? 'flex' : 'none';
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`button[onclick="switchTab('${tabName}')"]`).classList.add('active');
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById(`tab-${tabName}`).classList.add('active');
}

/* ================= DRAWER MENU (MOBILE) ================= */
// Trên mobile, 2 tab "Lấy dữ liệu" và "Tìm kiếm & Thay thế" được gom vào 1
// drawer trượt ra từ cạnh trái, mở/đóng bằng nút hamburger trên header.
// Khi drawer đóng lại, Text Editor chiếm trọn màn hình chính.
const sidebarEl = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    sidebarBackdrop.classList.remove('show');

/* ================= THANH TÌM KIẾM NỔI (FLOATING SEARCH BAR) ================= */
// Hiện khi: có ít nhất 1 kết quả tìm kiếm VÀ drawer đang đóng (tức người dùng
// đã quay lại xem/chỉnh Text Editor). Cho phép duyệt trước/sau và thay thế
// ngay trên Text Editor mà không cần mở lại menu.
function refreshFloatingSearchBar() {
    const bar = document.getElementById('floatingSearchBar');
    if (!bar) return;
    const hasMatches = searchState.matches.length > 0;
    const drawerOpen = sidebarEl.classList.contains('open');
    if (hasMatches && !drawerOpen) {
        bar.classList.add('show');
        document.getElementById('floatingNavCounter').innerText = document.getElementById('navCounter').innerText;
    } else {
        bar.classList.remove('show');
    }
}

function dismissFloatingSearchBar() {
    document.getElementById('floatingSearchBar').classList.remove('show');
}

/* ================= CODEMIRROR: EDITOR ẢO HÓA (VIRTUALIZED) ================= */
// Vấn đề gốc: <textarea> chuẩn HTML luôn giữ TOÀN BỘ nội dung trong DOM và
// buộc trình duyệt tính lại layout/shaping cho cả khối mỗi khi có thay đổi.
// Với văn bản 1 triệu+ ký tự, trên phần cứng yếu (đặc biệt GPU/driver yếu
// trên Linux) việc này gây đứng máy thật sự khi gõ.
//
// CodeMirror chỉ dựng (render) phần đang hiển thị trong khung nhìn + một
// vùng đệm nhỏ xung quanh (viewportMargin), bất kể văn bản dài bao nhiêu.
// Quan trọng hơn: vùng nhập liệu ẩn (hidden input) CodeMirror dùng để bắt
// phím gõ chỉ chứa một đoạn nhỏ quanh con trỏ, KHÔNG chứa toàn bộ tài liệu
// -> trình duyệt không còn phải shaping/spellcheck cả triệu ký tự mỗi lần
// gõ 1 phím nữa. Đây là nguyên nhân cốt lõi khiến việc gõ bị đứng, và
// CodeMirror giải quyết tận gốc, không phải là giảm nhẹ triệu chứng.
const editorTextareaEl = document.getElementById('editor');

const cmEditor = CodeMirror.fromTextArea(editorTextareaEl, {
    mode: null,             // Văn bản thuần, không cần tô cú pháp -> đỡ tốn CPU
    lineWrapping: true,     // Tương đương white-space: pre-wrap trước đây
    lineNumbers: false,     // Giữ giao diện như cũ
    viewportMargin: 30,     // Chỉ render thêm ~30 dòng ngoài khung nhìn (KHÔNG dùng Infinity,
                            // vì Infinity sẽ ép render toàn bộ tài liệu -> mất hết ý nghĩa ảo hóa)
    spellcheck: false,
    autofocus: false,
    dragDrop: false,        // Tắt xử lý kéo-thả mặc định của CodeMirror, dùng logic kéo-thả riêng của app bên dưới
    undoDepth: 200
});
window.cmEditor = cmEditor;

// ---- CẦU NỐI TƯƠNG THÍCH ----
// Toàn bộ code xử lý văn bản có sẵn của app (formatWattpad, smartJoin,
// removeEmptyLines, search/replace, v.v...) đang thao tác trực tiếp qua
// document.getElementById('editor').value/.selectionStart/.setSelectionRange()/
// .setRangeText()/.focus(). Thay vì sửa lại từng hàm, ta định nghĩa lại các
// thuộc tính/phương thức đó ngay trên phần tử textarea gốc (giờ đã bị
// CodeMirror ẩn đi) để tự động chuyển tiếp sang CodeMirror. Nhờ vậy toàn bộ
// phần còn lại của main.js không cần đổi một dòng nào.
Object.defineProperty(editorTextareaEl, 'value', {
    get() { return cmEditor.getValue(); },
    set(v) { cmEditor.setValue(v || ''); }
});

Object.defineProperty(editorTextareaEl, 'selectionStart', {
    get() { return cmEditor.indexFromPos(cmEditor.getCursor('from')); }
});

Object.defineProperty(editorTextareaEl, 'selectionEnd', {
    get() { return cmEditor.indexFromPos(cmEditor.getCursor('to')); }
});

editorTextareaEl.setSelectionRange = function (start, end) {
    cmEditor.setSelection(cmEditor.posFromIndex(start), cmEditor.posFromIndex(end));
};

editorTextareaEl.setRangeText = function (text, start, end) {
    cmEditor.replaceRange(text, cmEditor.posFromIndex(start), cmEditor.posFromIndex(end));
};

editorTextareaEl.focus = function () { cmEditor.focus(); };
editorTextareaEl.select = function () { cmEditor.execCommand('selectAll'); };

// Thay cho oninput="onEditorInput()" trên textarea gốc (đã bị ẩn nên không còn nhận sự kiện input)
cmEditor.on('change', () => onEditorInput());

// ---- CHẠY TÁC VỤ NẶNG KHÔNG LÀM ĐỨNG UI ----
// Các thao tác xử lý toàn bộ văn bản (lọc, nối, thay thế hàng loạt...) vẫn
// là O(n) theo độ dài văn bản - với 1 triệu+ ký tự có thể mất vài trăm ms.
// deferHeavy() nhường lại 1 nhịp cho trình duyệt vẽ xong trạng thái UI
// (log "đang xử lý") TRƯỚC KHI chạy tác vụ chặn main thread, để người dùng
// thấy phản hồi ngay khi bấm nút thay vì cảm giác đứng máy.
function deferHeavy(fn) {
    const len = editorTextareaEl.value.length;
    if (len > 150000) {
        UI.log('⏳ Đang xử lý văn bản lớn, vui lòng đợi giây lát...', 'info');
    }
    setTimeout(fn, 30);
}

/* ================= NHẬP FILE .TXT (KÉO-THẢ + NÚT TẢI LÊN) ================= */
const editorWrapper = document.getElementById('editorWrapper');
const editorEle = document.getElementById('editor');

// Hàm dùng chung: đọc 1 file .txt và nạp nội dung vào editor.
// Dùng chung cho cả kéo-thả (desktop) và nút "Tải file lên" (mobile),
// vì trên điện thoại kéo-thả file từ trình quản lý tệp vào trình duyệt
// không tiện lợi như trên máy tính (đây là hạn chế mặc định của nền tảng).
function importTxtFile(file) {
    if (!file) return;

    // Chỉ chấp nhận file .txt (theo đuôi file hoặc MIME type)
    if (file.type !== 'text/plain' && !file.name.toLowerCase().endsWith('.txt')) {
        return UI.toast("Chỉ hỗ trợ file định dạng Text (.txt)", "error");
    }

    const reader = new FileReader();
    reader.onload = (event) => {
        editorEle.value = event.target.result;
        updateStats();
        searchState.isDirty = true;
        UI.toast(`Đã nhập dữ liệu từ file: ${file.name}`, "success");
        UI.log(`Nhập file thành công: ${file.name} (${file.size} bytes)`, "success");
    };
    reader.onerror = () => UI.toast("Lỗi đọc file!", "error");
    reader.readAsText(file);
}

// --- Kéo & thả (chủ yếu dành cho desktop) ---
editorWrapper.addEventListener('dragover', (e) => {
    e.preventDefault();
    editorWrapper.classList.add('drag-over');
});

editorWrapper.addEventListener('dragleave', (e) => {
    e.preventDefault();
    editorWrapper.classList.remove('drag-over');
});

editorWrapper.addEventListener('drop', (e) => {
    e.preventDefault();
    editorWrapper.classList.remove('drag-over');
    if (e.dataTransfer.files.length > 0) {
        importTxtFile(e.dataTransfer.files[0]);
    }
});

// --- Nút "Tải file lên" (chủ yếu dành cho mobile, nhưng dùng tốt trên mọi thiết bị) ---
const btnUploadFile = document.getElementById('btnUploadFile');
const fileInput = document.getElementById('fileInput');

btnUploadFile.addEventListener('click', () => {
    fileInput.click();
});

fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
        importTxtFile(e.target.files[0]);
    }
    // Reset value để có thể chọn lại đúng file đó ở lần sau (đổi thì mới bắn sự kiện change)
    fileInput.value = '';
});


/* ================= KEYBOARD SHORTCUTS ================= */
document.addEventListener('keydown', (e) => {
    const isCtrl = e.ctrlKey || e.metaKey;

    // Ctrl + S: Tải xuống file
    if (isCtrl && e.key.toLowerCase() === 's') {
        e.preventDefault();
        downloadText();
    }

    // Ctrl + F: Chuyển sang tìm kiếm
    if (isCtrl && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        switchTab('search');
        document.getElementById('findStr').focus();
    }

    // Ctrl + Enter: Hành động tùy Tab
    if (isCtrl && e.key === 'Enter') {
        e.preventDefault();
        if (document.getElementById('tab-fetch').classList.contains('active')) {
            startFetch();
        } else if (document.getElementById('tab-search').classList.contains('active')) {
            replaceAll();
        }
    }
});

// Sự kiện riêng cho ô Find: Enter / Shift+Enter
document.getElementById('findStr').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault(); // Tránh tạo dòng mới trong textarea
        
        if (searchState.isDirty || searchState.matches.length === 0) {
            initSearch();
        } else {
            navMatch(e.shiftKey ? -1 : 1);
        }
    }
});


/* ================= PERSONAL PRESET (BỘ LỌC CÁ NHÂN) ================= */
let appPresets = JSON.parse(localStorage.getItem('aio_presets')) || [];

function openPresetModal() {

function closePresetModal() {
